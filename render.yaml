services:
  - type: web
    name: mythesis-backend
    runtime: python
    plan: free
    buildCommand: |
      pip install -r backend/requirements.txt
      mkdir -p data/processed data/raw data/interim outputs/models/finished_thesis
      cp sample_data/processed/*.csv data/processed/
      cp sample_data/models/finished_thesis/* outputs/models/finished_thesis/
      # The Live page needs raw .bin to replay and the two pipeline-derived
      # registries to satisfy check_live_precondition(). The disk is ephemeral
      # on the free plan, so both are re-seeded here on every deploy. The
      # registries are shipped rather than regenerated by a build-time ingest
      # because export_feature_csv() APPENDS: re-running Stage 2 over a day
      # already covered by sample_data/processed/ would double that day's rows
      # (measured: Dati05 380 -> 554) and mix GPS-shifted with unshifted rows.
      cp -r sample_data/raw/Dati05 data/raw/
      cp -r sample_data/interim/label_registry sample_data/interim/pairing_registry data/interim/
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      # scikit-learn 1.6.1 (see backend/requirements.txt) ships no wheels
      # for Python 3.14, which Render would otherwise default to.
      - key: PYTHON_VERSION
        value: "3.12.3"
    healthCheckPath: /api/health
