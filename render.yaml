services:
  - type: web
    name: mythesis-backend
    runtime: python
    plan: free
    buildCommand: |
      pip install -r backend/requirements.txt
      mkdir -p data/processed outputs/models/finished_thesis
      cp sample_data/processed/*.csv data/processed/
      cp sample_data/models/finished_thesis/* outputs/models/finished_thesis/
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      # scikit-learn 1.6.1 (see backend/requirements.txt) ships no wheels
      # for Python 3.14, which Render would otherwise default to.
      - key: PYTHON_VERSION
        value: "3.12.3"
    healthCheckPath: /api/health
